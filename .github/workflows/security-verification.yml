name: Android Security Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # actions/setup-java v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android v3
        with:
          packages: ''
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Gradle Wrapper integrity
        run: |
          echo "55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          ./gradlew --version
      - id: dependencies
        name: Resolve dependencies and verify checksums
        shell: bash
        run: |
          TASKS="testDownloadModelDebugUnitTest lintDownloadModelDebug :app:assembleDownloadModelDebug :app:assembleDownloadModelDebugAndroidTest"
          if [ -f gradle/verification-metadata.xml ]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            ./gradlew -PskipLlamaNativeBuild=true $TASKS
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            ./gradlew -PskipLlamaNativeBuild=true --write-verification-metadata sha256 $TASKS
          fi
      - name: Upload first-run dependency checksum baseline for review
        if: steps.dependencies.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact v5
        with:
          name: gradle-dependency-verification-baseline
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7
      - name: Verify APK signature and fingerprint
        run: |
          APK="app/build/outputs/apk/downloadModel/debug/app-downloadModel-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Check for plaintext password persistence
        run: |
          if grep -R -nE 'putString\("passwords"|passwordMap\.entries\.joinToString' app/src/main/java; then
            echo "Plaintext document password persistence detected"
            exit 1
          fi
      - name: Static audit for app-initiated upload requests
        run: |
          if grep -R -nE 'setRequestMethod\("(POST|PUT|PATCH)"\)|HttpPost|MultipartBody|FormBody' app/src/main/java; then
            echo "Review new app-initiated upload/request-body code before merging"
            exit 1
          fi
